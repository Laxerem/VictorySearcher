<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VictorySearcher — Вакансии</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Condensed:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="app.css" />
  <style>
    [hidden] { display: none !important; }
    .btn[disabled] { opacity: 0.5; cursor: not-allowed; }

    /* ---- vacancy list ---- */
    .vlist { border-right: 1px solid var(--line); background: var(--ink-850); display: flex; flex-direction: column; min-height: 0; }
    .vlist__head { display: flex; align-items: center; justify-content: space-between; padding: var(--space-4) var(--space-4) var(--space-3); border-bottom: 1px solid var(--line); }
    .vlist__title { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.03em; font-weight: 700; font-size: 18px; }

    /* search */
    .vlist__search { padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--line-soft); }
    .search-wrap { display: flex; align-items: center; gap: var(--space-2); background: var(--ink-800); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 6px var(--space-3); transition: border-color var(--dur) var(--ease); }
    .search-wrap:focus-within { border-color: var(--line-strong); }
    .search-wrap svg { color: var(--text-700); flex: none; width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .search-input { flex: 1; background: none; border: none; outline: none; font-family: var(--font-ui); font-size: 13px; color: var(--text-100); min-width: 0; }
    .search-input::placeholder { color: var(--text-700); }

    .vlist__scroll { overflow-y: auto; padding: var(--space-2); display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .vcard { text-align: left; width: 100%; background: transparent; border: 1px solid transparent; border-radius: var(--r-sm); padding: var(--space-3); cursor: pointer; display: flex; flex-direction: column; gap: 6px; transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease); color: inherit; }
    .vcard:hover { background: var(--ink-800); }
    .vcard--active { background: var(--ink-800); border-color: var(--line-strong); }
    .vcard--active .vcard__name { color: var(--text-100); }
    .vcard__name { font-size: 14px; font-weight: 600; color: var(--text-300); }
    .vcard__meta { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
    .vcard__count { font-family: var(--font-data); font-size: 12px; color: var(--text-500); }
    .vlist__empty { padding: var(--space-6); color: var(--text-500); font-size: 13px; }

    /* ---- main ---- */
    .main { overflow-y: auto; min-height: 0; padding: var(--space-6) var(--space-8); }
    .main__empty { height: 100%; display: grid; place-items: center; color: var(--text-500); font-size: 14px; }
    .detail { max-width: 760px; display: flex; flex-direction: column; gap: var(--space-5); }

    .detail__head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-4); }
    .detail__title { font-size: 22px; line-height: 28px; font-weight: 600; margin: 0; }
    .detail__sub { display: flex; align-items: center; gap: var(--space-3); margin-top: var(--space-2); }
    .detail__date { font-family: var(--font-data); font-size: 12px; color: var(--text-500); }
    .detail__actions { display: flex; gap: var(--space-2); flex: none; }

    /* ---- tab system ---- */
    .tabs-root { display: flex; flex-direction: column; gap: 0; }
    .tabs-list {
      display: flex; gap: 0;
      border-bottom: 1px solid var(--line);
    }
    .tab-trigger {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 9px 14px; font-size: 13px; font-weight: 500;
      color: var(--text-500); background: none; border: none;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      cursor: pointer; transition: color var(--dur) var(--ease);
      white-space: nowrap;
    }
    .tab-trigger:hover { color: var(--text-300); }
    .tab-trigger--active { color: var(--signal-300); border-bottom-color: var(--signal-500); }
    .tab-badge {
      font-family: var(--font-data); font-size: 11px;
      background: var(--ink-700); border: 1px solid var(--line-strong);
      border-radius: 999px; padding: 1px 7px; color: var(--text-500);
    }
    .tab-badge--warn { background: var(--warn-bg); border-color: transparent; color: var(--warn); }
    .tab-content { padding-top: var(--space-4); }

    /* ---- drop zone ---- */
    .drop { border: 1px dashed var(--line-strong); border-radius: var(--r-md); background: var(--ink-850); padding: var(--space-8); display: flex; flex-direction: column; align-items: center; gap: var(--space-2); text-align: center; cursor: pointer; transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease); }
    .drop:hover, .drop--over { border-color: var(--signal-700); background: var(--signal-900); }
    .drop__hint { color: var(--text-300); font-size: 14px; }
    .drop__sub { color: var(--text-500); font-size: 12px; }

    /* ---- file list table ---- */
    .file-table { width: 100%; border-collapse: collapse; }
    .file-table thead th { padding: 5px 10px; text-align: left; font-size: 11px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-700); border-bottom: 1px solid var(--line); }
    .file-table tbody tr { border-bottom: 1px solid var(--line-soft); }
    .file-table tbody tr:last-child { border-bottom: none; }
    .file-table tbody tr:hover { background: var(--ink-750); }
    .file-table td { padding: 9px 10px; font-size: 13px; vertical-align: middle; }
    .ft-fmt { font-family: var(--font-data); font-size: 11px; color: var(--text-700); width: 36px; }
    .ft-name { color: var(--text-100); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; }
    .ft-date { font-family: var(--font-data); font-size: 12px; color: var(--text-500); white-space: nowrap; }
    .ft-status { white-space: nowrap; }
    .ft-actions { display: flex; gap: 6px; justify-content: flex-end; }
    .act {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 10px; border-radius: var(--r-sm);
      background: var(--ink-700); border: 1px solid var(--line-strong);
      color: var(--text-300); font-size: 12px; font-family: var(--font-ui);
      cursor: pointer; transition: background 120ms, color 120ms; white-space: nowrap;
    }
    .act:hover { background: var(--ink-750); color: var(--text-100); }
    .act svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* ---- upload queue (below drop) ---- */
    .upload-queue { display: flex; flex-direction: column; gap: var(--space-1); margin-top: var(--space-3); }
    .upload-item { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3); background: var(--ink-800); border: 1px solid var(--line); border-radius: var(--r-sm); }
    .upload-item__icon { color: var(--text-500); flex: none; }
    .upload-item__name { font-size: 13px; color: var(--text-100); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .upload-item__size { font-family: var(--font-data); font-size: 12px; color: var(--text-500); flex: none; }

    /* ---- run bar ---- */
    .runbar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); padding-top: var(--space-4); }
    .runbar__note { font-size: 13px; color: var(--text-500); }
    .runbar__note b { color: var(--text-300); font-weight: 600; font-family: var(--font-data); }

    /* ---- scoring status ---- */
    .statusbar { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-5); border-radius: var(--r-md); }
    .statusbar__row { display: flex; align-items: center; justify-content: space-between; }
    .statusbar__label { font-size: 13px; color: var(--text-300); display: flex; align-items: center; gap: var(--space-2); }
    .statusbar__count { font-family: var(--font-data); font-size: 13px; color: var(--text-100); }
    .progress { height: 6px; background: var(--ink-700); border-radius: 999px; overflow: hidden; }
    .progress__fill { height: 100%; width: 0%; background: var(--signal-500); border-radius: 999px; transition: width 220ms linear; }

    /* ---- variant B: ring cards ---- */
    .scored-list { display: flex; flex-direction: column; gap: 8px; }
    .scored-empty { font-size: 13px; color: var(--text-500); padding: var(--space-4) 0; }

    .ring-card {
      display: flex; align-items: flex-start; gap: 14px;
      padding: 12px 14px;
      background: var(--ink-750); border: 1px solid var(--line);
      border-radius: var(--r-md); transition: border-color 120ms;
    }
    .ring-card:hover { border-color: var(--line-strong); }
    .ring-card--uncertain { border-color: var(--warn); background: var(--warn-bg); }

    .ring-wrap { flex-shrink: 0; position: relative; width: 52px; height: 52px; }
    .ring-wrap svg { display: block; transform: rotate(-90deg); }
    .ring-track { fill: none; stroke: var(--ink-700); stroke-width: 5; }
    .ring-fill  { fill: none; stroke-width: 5; stroke-linecap: round; }
    .ring-num {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-data); font-size: 14px; font-weight: 500;
    }
    .ring-hi  .ring-fill { stroke: var(--ok); }
    .ring-hi  .ring-num  { color: var(--ok); }
    .ring-mid .ring-fill { stroke: var(--signal-300); }
    .ring-mid .ring-num  { color: var(--signal-300); }
    .ring-low .ring-fill { stroke: var(--warn); }
    .ring-low .ring-num  { color: var(--warn); }
    .ring-bad .ring-fill { stroke: var(--alert); }
    .ring-bad .ring-num  { color: var(--alert); }
    .ring-unc .ring-fill { stroke: var(--warn); opacity: 0.5; }
    .ring-unc .ring-num  { color: var(--warn); }

    .rc-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .rc-row1 { display: flex; align-items: center; gap: 8px; }
    .rc-rank { font-family: var(--font-data); font-size: 11px; color: var(--text-700); flex-shrink: 0; }
    .rc-name { font-size: 13px; font-weight: 600; color: var(--text-100); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
    .rc-actions { display: flex; gap: 6px; flex-shrink: 0; }

    .rc-metrics { display: flex; gap: 12px; flex-wrap: wrap; }
    .rc-metric { display: flex; flex-direction: column; gap: 2px; }
    .rc-metric__bar-wrap { height: 3px; border-radius: 2px; overflow: hidden; background: var(--ink-700); }
    .rc-metric__bar { height: 100%; border-radius: 2px; }
    .rc-metric__footer { display: flex; justify-content: space-between; gap: 8px; }
    .rc-metric__label { font-size: 10px; color: var(--text-700); }
    .rc-metric__val   { font-family: var(--font-data); font-size: 11px; }
    .rc-val-hi  { color: var(--ok); }
    .rc-val-mid { color: var(--signal-300); }
    .rc-val-low { color: var(--warn); }
    .rc-val-bad { color: var(--alert); }

    .rc-reasoning { font-size: 12px; color: var(--text-500); line-height: 17px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }

    /* ---- vacancy description (below tabs) ---- */
    .vd-sections { display: flex; flex-direction: column; gap: var(--space-4); }
    .section { display: flex; flex-direction: column; gap: var(--space-3); }
    .section__title { font-size: 12px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-500); margin: 0; }
    .section__text { margin: 0; color: var(--text-300); font-size: 14px; line-height: 22px; max-width: 70ch; white-space: pre-wrap; }
    .chips { display: flex; flex-wrap: wrap; gap: var(--space-2); }
    .divider { height: 1px; background: var(--line); }

    /* ---- modal ---- */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: grid; place-items: center; z-index: 1000; padding: var(--space-4); }
    .modal { width: 540px; max-width: 100%; padding: var(--space-6); border-radius: var(--r-lg); box-shadow: var(--elev-2); }
    .modal__title { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.03em; font-weight: 700; font-size: 22px; margin: 0; }
    .modal__form { display: flex; flex-direction: column; gap: var(--space-4); margin-top: var(--space-5); }
    .modal__actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }

    /* ---- toast ---- */
    .toast-wrap { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1100; display: flex; flex-direction: column; gap: 8px; align-items: center; }
    .toast { background: var(--ink-750); border: 1px solid var(--line-strong); border-radius: var(--r-md); padding: 10px 14px; box-shadow: var(--elev-2); font-size: 13px; color: var(--text-100); display: flex; gap: 8px; align-items: center; }
  </style>
</head>
<body>
  <div class="shell">
    <!-- topbar -->
    <header class="topbar">
      <span class="brand">
        <span class="brand__mark" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 32 32" fill="none">
            <path d="M5 9 L16 23 L27 9" stroke="#F3F5F8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M11 9 L16 16" stroke="#46A6C4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
        <span class="brand__name"><b>Victory</b><span>Searcher</span></span>
      </span>
      <span class="topbar__context">

      </span>
      <span class="topbar__spacer"></span>
      <span class="topbar__account"><span class="avatar">RC</span><span>recruiter</span></span>

    <div class="body">
      <!-- left rail -->
      <nav class="rail" aria-label="Разделы">
        <p class="eyebrow" style="padding:0 10px var(--space-2)">Скоринг</p>

          <svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Вакансии

          <svg class="ic" viewBox="0 0 24 24"><path d="M4 18V9M9 18V5M14 18v-6M19 18v-9"/></svg>Результаты

        <div class="rail__group">

          </a>
        </div>
      </nav>

      <!-- content -->
      <div class="content">
        <aside class="vlist" aria-label="Список вакансий">
          <div class="vlist__head">
            <span class="vlist__title">Вакансии</span>
            <button class="btn btn--secondary" id="newVacancyBtn" style="height:30px;padding:0 10px">+ Новая</button>
          </div>
          <div class="vlist__search">
            <div class="search-wrap">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
              <input class="search-input" id="searchInput" placeholder="Поиск вакансий…" autocomplete="off" />
            </div>
          </div>
          <div class="vlist__scroll" id="vacancyList"></div>
        </aside>
        <main class="main" id="detailRoot"></main>
      </div>
    </div>
  </div>

  <input type="file" id="fileInput" multiple accept=".txt" hidden />

  <!-- new vacancy modal -->
  <div class="modal-backdrop" id="newVacancyModal" hidden>
    <div class="modal panel panel--inset" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 class="modal__title" id="modalTitle">Новая вакансия</h2>
      <form class="modal__form" id="vacancyForm" novalidate>
        <div class="field">
          <label class="label" for="vfTitle">Название</label>
          <input class="input" id="vfTitle" placeholder="Senior Frontend Developer" />
        </div>
        <div class="field">
          <label class="label" for="vfDesc">Описание</label>
          <textarea class="textarea" id="vfDesc" rows="3" placeholder="О вакансии…"></textarea>
        </div>
        <div class="field">
          <label class="label" for="vfReq">Требования</label>
          <textarea class="textarea" id="vfReq" rows="3" placeholder="Обязательные требования…"></textarea>
        </div>
        <div class="field">
          <label class="label" for="vfExtra">Дополнительные требования <span class="field__optional">(необязательно)</span></label>
          <textarea class="textarea" id="vfExtra" rows="2" placeholder="Желательные навыки…"></textarea>
        </div>
        <p class="error-text" id="vfError" hidden>Заполните название вакансии</p>
        <div class="modal__actions">
          <button type="button" class="btn btn--ghost" id="vacancyCancel">Отмена</button>
          <button type="submit" class="btn btn--primary">Создать вакансию</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>

  // ---- helpers ----
  function fmtBytes(b) {
    if (b >= 1024 * 1024) return (b / 1024 / 1024).toFixed(1) + ' МБ';
    if (b >= 1024) return Math.round(b / 1024) + ' КБ';
    return b + ' Б';
  }
  function fmtTime(d) {
    return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  }
  function ext(name) { return '.' + (name.split('.').pop() || '').toLowerCase(); }
  function loadedCount(id) { return (uploads[id] || []).filter(e => e.status === 'loaded').length; }

  function statusChip(v) {
    if (v.status === 'inProcess') return '<span class="chip chip--signal"><span class="dot dot--signal"></span>идёт скоринг</span>';
    if (v.status === 'finished') {
      const flags = v.flags ? '<span class="chip chip--warn">⚑ ' + v.flags + '</span>' : '';
      return '<span class="chip chip--ok">готово</span>' + flags;
    }
    return '<span class="chip"><span class="dot dot--muted"></span>черновик</span>';
  }

  function toast(text) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = '<span class="dot dot--signal"></span>' + text;
    document.getElementById('toastWrap').appendChild(el);
    setTimeout(() => el.remove(), 2600);
  }

  // ---- ring SVG ----
  // r=21 → circumference = 2π×21 ≈ 132
  function scoreTier(score) {
    if (score === null) return 'ring-unc';
    if (score >= 80) return 'ring-hi';
    if (score >= 60) return 'ring-mid';
    if (score >= 40) return 'ring-low';
    return 'ring-bad';
  }
  function metricTier(val, max) {
    const pct = val / max;
    if (pct >= 0.8) return 'rc-val-hi';
    if (pct >= 0.6) return 'rc-val-mid';
    if (pct >= 0.4) return 'rc-val-low';
    return 'rc-val-bad';
  }
  function barColor(val, max) {
    const pct = val / max;
    if (pct >= 0.8) return 'var(--ok)';
    if (pct >= 0.6) return 'var(--signal-500)';
    if (pct >= 0.4) return 'var(--warn)';
    return 'var(--alert)';
  }
  function ringHTML(score, tier) {
    const fill = score === null ? 0 : Math.round((score / 100) * 132);
    const label = score === null ? '?' : score;
    return `<div class="ring-wrap ${tier}">
      <svg width="52" height="52" viewBox="0 0 52 52">
        <circle class="ring-track" cx="26" cy="26" r="21"/>
        <circle class="ring-fill" cx="26" cy="26" r="21"
          stroke-dasharray="${fill} 132" transform="rotate(-90 26 26)"/>
      </svg>
      <div class="ring-num">${label}</div>
    </div>`;
  }

  function metricBarHTML(val, max, label, width) {
    const pct = Math.round((val / max) * 100);
    const tier = metricTier(val, max);
    return `<div class="rc-metric" style="width:${width}px">
      <div class="rc-metric__bar-wrap" style="width:${width}px">
        <div class="rc-metric__bar" style="width:${pct}%;background:${barColor(val,max)}"></div>
      </div>
      <div class="rc-metric__footer">
        <span class="rc-metric__label">${label}</span>
        <span class="rc-metric__val ${tier}">${val}/${max}</span>
      </div>
    </div>`;
  }

  function ringCardHTML(item, rank, uncertain) {
    const tier = scoreTier(item.score);
    const rankLabel = uncertain ? '<span class="rc-rank">⚑ неопределённо</span>' : `<span class="rc-rank">#${rank}</span>`;
    const metrics = uncertain ? '' :
      `<div class="rc-metrics">
        ${metricBarHTML(item.exp,    50, 'Опыт',    88)}
        ${metricBarHTML(item.skills, 40, 'Навыки',  88)}
        ${metricBarHTML(item.extra,  10, 'Доп.',    60)}
      </div>`;
    return `<div class="ring-card ${uncertain ? 'ring-card--uncertain' : ''}">
      ${ringHTML(item.score, tier)}
      <div class="rc-body">
        <div class="rc-row1">
          ${rankLabel}
          <span class="rc-name">${item.name}</span>
          <div class="rc-actions">
            <button class="act" data-stub="Просмотр резюме">${ICO_EYE}Просмотр</button>
            <button class="act" data-stub="Скачать резюме">${ICO_DL}Скачать</button>
          </div>
        </div>
        ${metrics}
        <div class="rc-reasoning">${item.reasoning}</div>
      </div>
    </div>`;
  }

  // ---- file table row ----
  function fileRowHTML(f) {
    const statusChipHtml = f.scored
      ? '<span class="chip chip--ok" style="font-size:11px;padding:2px 8px">Проверен</span>'
      : '<span class="chip" style="font-size:11px;padding:2px 8px">Загружен</span>';
    return `<tr>
      <td class="ft-fmt">${f.fmt}</td>
      <td><span class="ft-name">${f.name}</span></td>
      <td class="ft-date">${f.date}</td>
      <td class="ft-status">${statusChipHtml}</td>
      <td><div class="ft-actions">
        <button class="act" data-stub="Просмотр резюме">${ICO_EYE}Просмотр</button>
        <button class="act" data-stub="Скачать резюме">${ICO_DL}Скачать</button>
      </div></td>
    </tr>`;
  }

  // ---- render: vacancy list ----
  function renderList() {
    const root = document.getElementById('vacancyList');
    const q = searchQuery.trim().toLowerCase();
    const filtered = q ? vacancies.filter(v => v.title.toLowerCase().includes(q)) : vacancies;
    if (!filtered.length) {
      root.innerHTML = '<div class="vlist__empty">' + (q ? 'Нет вакансий по запросу.' : 'Нет вакансий. Создайте первую.') + '</div>';
      return;
    }
    root.innerHTML = filtered.map(v => {
      const count = v.resumeCount || loadedCount(v.id);
      const countHtml = count ? `<span class="vcard__count">${count} резюме</span>` : '';
      return `<button class="vcard ${v.id === selectedId ? 'vcard--active' : ''}" data-id="${v.id}">
        <span class="vcard__name">${v.title}</span>
        <span class="vcard__meta">${countHtml}${statusChip(v)}</span>
      </button>`;
    }).join('');
    root.querySelectorAll('.vcard').forEach(c => c.addEventListener('click', () => selectVacancy(c.dataset.id)));
  }

  // ---- render: tab content ----
  function getTab(v) {
    if (selectedTab[v.id]) return selectedTab[v.id];
    if (v.status === 'finished') return 'scored';
    return 'description';
  }

  function renderTabDescription(v) {
    const extraSection = v.extra
      ? `<section class="section"><h2 class="section__title">Дополнительные требования</h2><p class="section__text">${v.extra}</p></section>`
      : '';
    const skillChips = (v.skills || []).map(s => `<span class="chip">${s}</span>`).join('');

    let uploadBlock = '';

    if (v.status === 'draft') {
      const queue  = uploads[v.id] || [];
      const loaded = loadedCount(v.id);
      const total  = queue.length;
      const queueRows = queue.length
        ? '<div class="upload-queue">' + queue.map(e => {
            let chip;
            if (e.status === 'loading') chip = '<span class="chip chip--signal"><span class="dot dot--signal"></span>обработка</span>';
            else if (e.status === 'loaded') chip = '<span class="chip chip--ok">✓ ' + fmtTime(e.loadedAt) + '</span>';
            else chip = '<span class="chip chip--alert">' + e.errorMessage + '</span>';
            return `<div class="upload-item">${FILE_ICON}<span class="upload-item__name">${e.name}</span><span class="upload-item__size">${fmtBytes(e.size)}</span>${chip}</div>`;
          }).join('') + '</div>'
        : '';
      uploadBlock = `<div class="divider"></div>
        <div class="drop" id="dropZone">
          <svg style="width:22px;height:22px;fill:none;stroke:var(--text-500);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
          <span class="drop__hint">Перетащите резюме или <span style="color:var(--signal-300)">выберите файлы</span></span>
          <span class="drop__sub">TXT · несколько за раз</span>
        </div>
        ${queueRows}
        <div class="runbar">
          <span class="runbar__note">Готово к скорингу: <b>${loaded}</b> из <b>${total}</b> файлов</span>
          <button class="btn btn--primary btn--lg" id="runBtn" ${loaded ? '' : 'disabled'}>Запустить скоринг</button>
        </div>`;
    } else if (v.status === 'inProcess') {
      const total = v.resumeCount || 0;
      const pct   = total ? (v.scored || 0) / total * 100 : 0;
      uploadBlock = `<div class="divider"></div>
        <div class="statusbar panel panel--inset">
          <div class="statusbar__row">
            <span class="statusbar__label"><span class="dot dot--signal"></span>Идёт скоринг резюме</span>
            <span class="statusbar__count" id="scCount">${v.scored || 0} из ${total}</span>
          </div>
          <div class="progress"><div class="progress__fill" id="scFill" style="width:${pct}%"></div></div>
          <span style="font-size:13px;color:var(--text-500)">Процесс идёт в фоне — можно переключиться на другую вакансию.</span>
        </div>`;
    }

    return `<div class="vd-sections">
      <section class="section">
        <h2 class="section__title">Описание</h2>
        <p class="section__text">${v.description}</p>
      </section>
      <section class="section">
        <h2 class="section__title">Требования</h2>
        <p class="section__text">${v.requirements}</p>
        ${skillChips ? `<div class="chips">${skillChips}</div>` : ''}
      </section>
      ${extraSection}
    </div>
    ${uploadBlock}`;
  }

  function renderTabFiles(v) {
    const files = v.files || [];
    if (!files.length) return '<div class="scored-empty">Нет загруженных файлов.</div>';
    return `<table class="file-table">
      <thead><tr>
        <th>Формат</th><th>Файл</th><th>Загружен</th><th>Статус</th><th style="text-align:right">Действия</th>
      </tr></thead>
      <tbody>${files.map(fileRowHTML).join('')}</tbody>
    </table>`;
  }

  function renderTabScored(v) {
    const scored = v.scored || [];
    if (!scored.length) return '<div class="scored-empty">Нет проверенных резюме.</div>';
    return '<div class="scored-list">' + scored.map((r, i) => ringCardHTML(r, i + 1, false)).join('') + '</div>';
  }

  function renderTabUncertain(v) {
    const uncertain = v.uncertain || [];
    if (!uncertain.length) return '<div class="scored-empty">Неопределённых резюме нет.</div>';
    return '<div class="scored-list">' + uncertain.map(r => ringCardHTML(r, 0, true)).join('') + '</div>';
  }

  // ---- render: detail ----
  function renderDetail() {
    const root = document.getElementById('detailRoot');
    const v = vacancies.find(x => x.id === selectedId);
    if (!v) { root.innerHTML = '<div class="main__empty">Выберите вакансию, чтобы начать работу</div>'; return; }

    const tab = getTab(v);

    const totalFiles = (v.files || []).length + (uploads[v.id] || []).length;
    const scoredCount = (v.scored || []).length;
    const uncertainCount = (v.uncertain || []).length;

    const fileBadge    = totalFiles     ? `<span class="tab-badge">${totalFiles}</span>` : '';
    const scoredBadge  = scoredCount    ? `<span class="tab-badge">${scoredCount}</span>` : '';
    const uncBadge     = uncertainCount ? `<span class="tab-badge tab-badge--warn">${uncertainCount}</span>` : '';

    let tabContent = '';
    if (tab === 'description') tabContent = renderTabDescription(v);
    if (tab === 'files')       tabContent = renderTabFiles(v);
    if (tab === 'scored')      tabContent = renderTabScored(v);
    if (tab === 'uncertain')   tabContent = renderTabUncertain(v);

    root.innerHTML = `
      <article class="detail">
        <div class="detail__head">
          <div>
            <h1 class="detail__title">${v.title}</h1>
            <div class="detail__sub"><span class="detail__date">создано ${v.createdAt}</span>${statusChip(v)}</div>
          </div>
          <div class="detail__actions">
            <button class="btn btn--ghost" data-stub="Редактирование вакансии">Редактировать</button>
          </div>
        </div>

        <div class="tabs-root">
          <div class="tabs-list" id="tabList">
            <button class="tab-trigger ${tab === 'description' ? 'tab-trigger--active' : ''}" data-tab="description">
              Описание
            </button>
            <button class="tab-trigger ${tab === 'files' ? 'tab-trigger--active' : ''}" data-tab="files">
              Загруженные резюме${fileBadge}
            </button>
            <button class="tab-trigger ${tab === 'scored' ? 'tab-trigger--active' : ''}" data-tab="scored">
              Проверенные резюме${scoredBadge}
            </button>
            <button class="tab-trigger ${tab === 'uncertain' ? 'tab-trigger--active' : ''}" data-tab="uncertain">
              Неопределённые${uncBadge}
            </button>
          </div>
          <div class="tab-content" id="tabContent">
            ${tabContent}
          </div>
        </div>
      </article>`;

    bindDetail(v);
  }

  function bindDetail(v) {
    // tabs
    document.querySelectorAll('#tabList .tab-trigger').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedTab[v.id] = btn.dataset.tab;
        renderDetail();
      });
    });

    // drop zone
    const drop = document.getElementById('dropZone');
    if (drop) {
      drop.addEventListener('click', () => {
        const input = document.getElementById('fileInput');
        input.onchange = e => { handleFiles(v.id, Array.from(e.target.files || [])); input.value = ''; };
        input.click();
      });
      drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drop--over'); });
      drop.addEventListener('dragleave', () => drop.classList.remove('drop--over'));
      drop.addEventListener('drop', e => {
        e.preventDefault(); drop.classList.remove('drop--over');
        handleFiles(v.id, Array.from(e.dataTransfer.files || []));
      });
    }

    // run button
    const runBtn = document.getElementById('runBtn');
    if (runBtn) runBtn.addEventListener('click', () => startScoring(v.id));

    bindStubs(document.getElementById('detailRoot'));
  }

  // ---- upload stub ----
  function handleFiles(id, files) {
    if (!files.length) return;
    if (!uploads[id]) uploads[id] = [];
    files.forEach((file, i) => {
      const entry = { id: Date.now() + '-' + i, name: file.name, size: file.size || 0, status: 'loading' };
      uploads[id].push(entry);
      setTimeout(() => {
        if (!ACCEPTED.includes(ext(entry.name))) {
          entry.status = 'error'; entry.errorMessage = 'Неподдерживаемый формат';
        } else {
          entry.status = 'loaded'; entry.loadedAt = new Date();
        }
        if (selectedId === id) renderDetail();
        renderList();
      }, 700);
    });
    renderDetail();
  }

  // ---- scoring stub ----
  function startScoring(id) {
    const v = vacancies.find(x => x.id === id);
    const total = loadedCount(id);
    if (!total) return;
    v.status = 'inProcess'; v.resumeCount = total; v.scored = 0;
    selectedTab[id] = 'description';
    renderList(); renderDetail();
    const timer = setInterval(() => {
      v.scored++;
      const fill = document.getElementById('scFill');
      const cnt  = document.getElementById('scCount');
      if (fill) fill.style.width = (v.scored / total * 100) + '%';
      if (cnt)  cnt.textContent  = v.scored + ' из ' + total;
      if (v.scored >= total) {
        clearInterval(timer);
        v.status = 'finished';
        v.flags  = Math.floor(Math.random() * 3);
        // generate stub results
        const names = (uploads[id] || []).filter(e => e.status === 'loaded').map(e => e.name);
        v.scored  = names.map((name, i) => ({
          id: 'r' + i, name,
          score: 55 + Math.floor(Math.random() * 35),
          exp:   20 + Math.floor(Math.random() * 25),
          skills: 15 + Math.floor(Math.random() * 20),
          extra: 3 + Math.floor(Math.random() * 7),
          reasoning: 'Автоматически сгенерированный результат для демонстрации.',
        })).sort((a, b) => b.score - a.score);
        v.uncertain = [];
        v.files = names.map((name, i) => ({ id: 'f' + i, name, fmt: 'TXT', date: '24.06.2026', scored: true }));
        selectedTab[id] = 'scored';
        renderList(); renderDetail();
        toast('Скоринг завершён: оценено ' + total + ' резюме');
      }
    }, 450);
  }

  function selectVacancy(id) {
    if (id === selectedId) return;
    selectedId = id;
    renderList(); renderDetail();
  }

  // ---- search ----
  document.getElementById('searchInput').addEventListener('input', e => {
    searchQuery = e.target.value;
    renderList();
  });

  // ---- new vacancy modal ----
  const modal = document.getElementById('newVacancyModal');
  function openModal() { modal.hidden = false; document.getElementById('vfTitle').focus(); }
  function closeModal() {
    modal.hidden = true;
    document.getElementById('vacancyForm').reset();
    document.getElementById('vfError').hidden = true;
  }
  document.getElementById('newVacancyBtn').addEventListener('click', openModal);
  document.getElementById('vacancyCancel').addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  document.getElementById('vacancyForm').addEventListener('submit', e => {
    e.preventDefault();
    const title = document.getElementById('vfTitle').value.trim();
    if (!title) { document.getElementById('vfError').hidden = false; return; }
    const req    = document.getElementById('vfReq').value.trim();
    const skills = req.split(/[,;]/).map(s => s.trim()).filter(Boolean).slice(0, 6);
    const v = {
      id: 'v' + Date.now(), title,
      description: document.getElementById('vfDesc').value.trim() || '—',
      requirements: req || '—',
      extra: document.getElementById('vfExtra').value.trim(),
      skills, createdAt: '24.06.2026', status: 'draft', flags: 0,
    };
    vacancies.unshift(v);
    selectedId = v.id;
    closeModal();
    renderList(); renderDetail();
    toast('Вакансия создана');
  });

  function bindStubs(scope) {
    (scope || document).querySelectorAll('[data-stub]').forEach(el => {
      if (el.dataset.bound) return;
      el.dataset.bound = '1';
      el.addEventListener('click', () => toast(el.dataset.stub + ' — в разработке'));
    });
  }
