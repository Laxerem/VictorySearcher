<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VictorySearcher — Вход</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Condensed:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="app.css" />
  <style>
    .auth {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: var(--space-6);
      position: relative;
      overflow: hidden;
    }
    /* faint instrument grid backdrop — quiet, from references */
    .auth::before {
      content: "";
      position: absolute; inset: 0;
      background-image:
        linear-gradient(var(--line-soft) 1px, transparent 1px),
        linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(circle at 50% 42%, #000 0%, transparent 62%);
      opacity: 0.5;
      pointer-events: none;
    }
    .auth__card {
      position: relative;
      width: 100%;
      max-width: 392px;
      padding: var(--space-8) var(--space-8) var(--space-6);
      border-radius: var(--r-lg);
    }
    /* single signal hairline at the top edge — the one chromatic note */
    .auth__card::before {
      content: "";
      position: absolute; left: var(--space-8); right: var(--space-8); top: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--signal-500), transparent);
      opacity: 0.7;
    }
    .auth__brand { display: flex; flex-direction: column; align-items: center; gap: var(--space-4); }
    .auth__mark {
      width: 52px; height: 52px;
      display: grid; place-items: center;
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      background: var(--ink-750);
      box-shadow: inset 0 1px 0 var(--edge-highlight);
    }
    .auth__wordmark {
      font-family: var(--font-display);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 800;
      font-size: 30px;
      line-height: 1;
      text-align: center;
    }
    .auth__wordmark b { color: var(--text-100); }
    .auth__wordmark span { color: var(--text-500); font-weight: 600; }
    .auth__sub {
      text-align: center;
      color: var(--text-500);
      font-size: 13px; line-height: 18px;
      margin: 0;
    }
    .auth__divider {
      height: 1px; background: var(--line);
      margin: var(--space-6) 0;
    }
    .auth__form { display: flex; flex-direction: column; gap: var(--space-4); }
    .auth__foot {
      margin: var(--space-6) 0 0;
      text-align: center;
      font-size: 12px; line-height: 16px;
      color: var(--text-700);
    }
  </style>
</head>
<body>
  <main class="auth">
    <section class="auth__card panel panel--inset" aria-labelledby="brand">
      <div class="auth__brand">
        <span class="auth__mark" aria-hidden="true">
          <svg width="30" height="30" viewBox="0 0 32 32" fill="none">
            <path d="M5 9 L16 23 L27 9" stroke="#F3F5F8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M11 9 L16 16" stroke="#46A6C4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
        <h1 id="brand" class="auth__wordmark"><b>Victory</b><span>Searcher</span></h1>
        <p class="auth__sub">Внутренний инструмент скоринга резюме и аналитики рынка</p>
      </div>

      <div class="auth__divider"></div>

      <form class="auth__form" id="loginForm" novalidate>
        <div class="field">
          <label class="label" for="login">Логин</label>
          <input class="input" id="login" name="login" type="text" placeholder="recruiter" autocomplete="username" />
        </div>
        <div class="field">
          <label class="label" for="password">Пароль</label>
          <input class="input" id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <p class="error-text" id="loginError" hidden>Неверный логин или пароль</p>
        <button class="btn btn--primary btn--block btn--lg" id="loginBtn" type="submit">Войти</button>
      </form>

      <p class="auth__foot">Доступ только для сотрудников Victory Group</p>
    </section>
  </main>

  <script>
    // Заглушка авторизации: любой непустой логин/пароль → переход на вакансии.
    // В реальном Web: useLogin → onSuccess(token) → navigate('/scoring').
    const form = document.getElementById('loginForm');
    const err = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const login = document.getElementById('login').value.trim();
      const password = document.getElementById('password').value.trim();
      if (!login || !password) {
        err.hidden = false;
        return;
      }
      err.hidden = true;
      btn.textContent = 'Вход…';
      btn.disabled = true;
      setTimeout(() => { window.location.href = 'vacancies.html'; }, 350);
    });
  </script>
</body>
</html>
