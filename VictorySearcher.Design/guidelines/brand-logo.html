<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  html,body{margin:0;background:var(--surface-page);font-family:var(--font-body);}
  .wrap{display:flex;align-items:center;gap:40px;padding:32px;}
  .panel{flex:1;height:86px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border-hairline);border-radius:var(--radius-sm);}
  .panel img{height:34px;}
  .note{font-size:12px;color:var(--text-muted);max-width:200px;line-height:1.5;}
</style></head><body>
<div class="wrap">
  <div class="panel" style="background:#000"><img src="../assets/logo.png" alt="Victory Group"/></div>
  <div class="panel" style="background:var(--surface-card)"><img src="../assets/logo.png" alt="Victory Group"/></div>
  <span class="note">Always on dark. Keep clear space ≥ the chevron height around all sides.</span>
</div>
</body></html>
