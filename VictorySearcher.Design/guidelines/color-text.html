<!-- @dsCard group="Colors" viewport="700x140" name="Text + action" subtitle="Text on dark · light action surface" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  html,body{margin:0;background:var(--surface-page);font-family:var(--font-body);}
  .wrap{display:flex;align-items:center;gap:40px;padding:28px 32px;}
  .stack{display:flex;flex-direction:column;gap:10px;}
  .ln{font-size:18px;font-weight:600;}
  .cap{font-size:10px;color:var(--text-faint);font-family:var(--font-mono);margin-left:10px;font-weight:400;}
  .btn{background:var(--action-fill);color:var(--text-on-light);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:13px;padding:15px 28px;border-radius:var(--radius-sm);}
</style></head><body>
<div class="wrap">
  <div class="stack">
    <span class="ln" style="color:var(--text-strong)">Strong<span class="cap">#f4f4f5</span></span>
    <span class="ln" style="color:var(--text-body)">Body<span class="cap">#c9c9ce</span></span>
    <span class="ln" style="color:var(--text-muted)">Muted<span class="cap">#8c8c93</span></span>
    <span class="ln" style="color:var(--text-faint)">Faint<span class="cap">#6a6a71</span></span>
  </div>
  <div class="btn">Отправить</div>
</div>
</body></html>
