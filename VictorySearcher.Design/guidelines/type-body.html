<!-- @dsCard group="Type" viewport="700x230" name="Body + eyebrow — Manrope" subtitle="UI text, captions, wide-tracked overline" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  html,body{margin:0;background:var(--surface-page);}
  .wrap{padding:30px 32px;display:flex;flex-direction:column;gap:16px;font-family:var(--font-body);}
  .eyebrow{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.22em;color:var(--text-muted);}
  .l{font-size:19px;color:var(--text-strong);font-weight:500;}
  .m{font-size:16px;color:var(--text-body);line-height:1.55;max-width:520px;}
  .s{font-size:14px;color:var(--text-muted);}
  .meta{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);}
</style></head><body>
<div class="wrap">
  <span class="eyebrow">Готовы к взрывному росту?</span>
  <span class="l">Выбирайте работать с лучшими <span class="meta">body-l · 500</span></span>
  <span class="m">Соберём полное семантическое ядро, оптимизируем страницы под ключевые запросы и выведем сайт на первые позиции. <span class="meta">body-m · 400</span></span>
  <span class="s">Активных клиентов: 20 000 <span class="meta">body-s · 500</span></span>
</div>
</body></html>
