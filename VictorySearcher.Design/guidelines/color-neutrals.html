<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals — ink scale" subtitle="Near-black surface ladder, page → hairline" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  html,body{margin:0;background:var(--surface-page);font-family:var(--font-body);}
  .wrap{display:flex;padding:24px 28px;gap:0;}
  .sw{flex:1;height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box;border:1px solid var(--border-hairline);border-right:none;}
  .sw:last-child{border-right:1px solid var(--border-hairline);}
  .n{font-size:11px;color:var(--text-strong);font-weight:600;}
  .h{font-size:10px;color:var(--text-faint);font-family:var(--font-mono);}
</style></head><body>
<div class="wrap">
  <div class="sw" style="background:#000000"><span class="n">black</span><span class="h">#000000</span></div>
  <div class="sw" style="background:#050506"><span class="n">ink-900</span><span class="h">#050506</span></div>
  <div class="sw" style="background:#0c0c0e"><span class="n">ink-800</span><span class="h">#0c0c0e</span></div>
  <div class="sw" style="background:#141417"><span class="n">ink-700</span><span class="h">#141417</span></div>
  <div class="sw" style="background:#1c1c20"><span class="n">ink-600</span><span class="h">#1c1c20</span></div>
  <div class="sw" style="background:#26262b"><span class="n">ink-500</span><span class="h">#26262b</span></div>
  <div class="sw" style="background:#3a3a41"><span class="n">ink-400</span><span class="h">#3a3a41</span></div>
</div>
</body></html>
