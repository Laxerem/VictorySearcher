<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base grid" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  html,body{margin:0;background:var(--surface-page);font-family:var(--font-body);}
  .wrap{display:flex;align-items:flex-end;gap:16px;padding:28px 32px;}
  .col{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .bar{background:var(--vg-orange);width:100%;border-radius:1px;}
  .box{width:40px;display:flex;flex-direction:column;align-items:center;gap:8px;}
  .t{font-size:11px;color:var(--text-muted);font-family:var(--font-mono);}
</style></head><body>
<div class="wrap">
  <div class="box"><div class="bar" style="height:8px"></div><span class="t">8</span></div>
  <div class="box"><div class="bar" style="height:16px"></div><span class="t">16</span></div>
  <div class="box"><div class="bar" style="height:24px"></div><span class="t">24</span></div>
  <div class="box"><div class="bar" style="height:32px"></div><span class="t">32</span></div>
  <div class="box"><div class="bar" style="height:48px"></div><span class="t">48</span></div>
  <div class="box"><div class="bar" style="height:64px"></div><span class="t">64</span></div>
  <div class="box"><div class="bar" style="height:80px"></div><span class="t">80</span></div>
</div>
</body></html>
