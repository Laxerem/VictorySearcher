<!-- @dsCard group="Colors" viewport="700x150" name="Neon accents" subtitle="Category glows — used sparingly" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  html,body{margin:0;background:var(--surface-page);font-family:var(--font-body);}
  .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding:28px;}
  .sw{height:90px;border-radius:var(--radius-sm);display:flex;flex-direction:column;justify-content:flex-end;padding:12px;box-sizing:border-box;background:var(--surface-card);border:1px solid var(--border-hairline);}
  .dot{width:20px;height:20px;border-radius:50%;margin-bottom:auto;}
  .n{font-size:12px;color:var(--text-strong);font-weight:600;}
  .h{font-size:10px;color:var(--text-faint);font-family:var(--font-mono);}
</style></head><body>
<div class="wrap">
  <div class="sw"><span class="dot" style="background:var(--vg-orange);box-shadow:var(--glow-orange)"></span><span class="n">Реклама</span><span class="h">#ff6a1a</span></div>
  <div class="sw"><span class="dot" style="background:var(--vg-cyan);box-shadow:var(--glow-cyan)"></span><span class="n">Лидоген.</span><span class="h">#1e9cff</span></div>
  <div class="sw"><span class="dot" style="background:var(--vg-magenta);box-shadow:var(--glow-magenta)"></span><span class="n">Digital</span><span class="h">#c026d3</span></div>
  <div class="sw"><span class="dot" style="background:var(--vg-green);box-shadow:var(--glow-green)"></span><span class="n">Репутация</span><span class="h">#3bdc6b</span></div>
</div>
</body></html>
