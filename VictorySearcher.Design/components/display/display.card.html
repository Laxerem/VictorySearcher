<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  html,body{margin:0;background:var(--surface-page);}
  #root{padding:36px 40px;display:flex;flex-direction:column;gap:26px;}
  .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .lbl{font-family:var(--font-body);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-faint);width:100%;}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Eyebrow, Badge, Card, ServiceCard } = window.VictoryGroupDesignSystem_5427f7;
  function Demo(){
    return (
      <>
        <div className="row"><span className="lbl">Eyebrow + badges</span>
          <Eyebrow>Наша история</Eyebrow>
          <Badge>SEO</Badge>
          <Badge accent="orange">Реклама</Badge>
          <Badge accent="cyan">Лидогенерация</Badge>
          <Badge accent="magenta">Digital</Badge>
          <Badge accent="green">Репутация</Badge>
        </div>
        <div className="grid">
          <ServiceCard title="Укрепим доверие" active>
            Поднимем рейтинг на Яндекс.Картах, Google и 2GIS, чтобы клиенты не сомневались в выборе.
          </ServiceCard>
          <Card interactive>
            <Eyebrow>Активных клиентов</Eyebrow>
            <div style={{fontFamily:'var(--font-display)',fontSize:'40px',fontWeight:700,color:'var(--text-strong)',marginTop:8}}>20 000</div>
          </Card>
        </div>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
