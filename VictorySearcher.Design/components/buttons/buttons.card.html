<!-- @dsCard group="Components" viewport="700x300" name="Buttons" subtitle="Primary / secondary / ghost · icon buttons" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  html,body{margin:0;background:var(--surface-page);}
  #root{padding:36px 40px;display:flex;flex-direction:column;gap:28px;}
  .row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .lbl{font-family:var(--font-body);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-faint);width:100%;}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Button, IconButton } = window.VictoryGroupDesignSystem_5427f7;
  const Arrow = () => <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 2L10 7L5 12" stroke="currentColor" strokeWidth="1.6" strokeLinecap="square"/></svg>;
  function Demo(){
    return (
      <>
        <div className="row"><span className="lbl">Variants</span>
          <Button variant="primary" size="lg">Хочу больше клиентов</Button>
          <Button variant="secondary">Все продукты</Button>
          <Button variant="ghost">Подробнее</Button>
          <Button variant="primary" disabled>Disabled</Button>
        </div>
        <div className="row"><span className="lbl">Sizes</span>
          <Button size="sm">Small</Button>
          <Button size="md">Medium</Button>
          <Button size="lg">Large</Button>
        </div>
        <div className="row"><span className="lbl">Icon buttons</span>
          <IconButton shape="square" label="next"><Arrow/></IconButton>
          <IconButton shape="circle" size={48} label="call"><Arrow/></IconButton>
        </div>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
