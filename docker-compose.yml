services:
  api:
    build:
      context: ./VictorySearcher.Service
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__Postgres=Host=db;Port=5432;Database=victorysearcher;Username=app;Password=apppassword
      - Jwt__Secret=${JWT_SECRET:-victory-searcher-super-secret-key-32chars}
      - Jwt__Username=${APP_USERNAME:-recruiter}
      - Jwt__Password=${APP_PASSWORD:-password}
      - Llm__ApiKey=${LLM_API_KEY:-placeholder}
      - Llm__BaseUrl=${LLM_BASE_URL:-https://api.polza.ai/v1}
      - Llm__ModelId=${LLM_MODEL_ID:-gpt-4o}
      - Storage__UploadsPath=/uploads
    volumes:
      - uploads_data:/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: victorysearcher
      POSTGRES_USER: app
      POSTGRES_PASSWORD: apppassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d victorysearcher"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
